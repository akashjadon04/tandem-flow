<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" fill="none">
  <defs>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="tfGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="tfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="120" rx="16" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="0.8">
    <line x1="20" y1="30" x2="700" y2="30" />
    <line x1="20" y1="60" x2="700" y2="60" />
    <line x1="20" y1="90" x2="700" y2="90" />
    <line x1="120" y1="10" x2="120" y2="110" />
    <line x1="240" y1="10" x2="240" y2="110" />
    <line x1="360" y1="10" x2="360" y2="110" />
    <line x1="480" y1="10" x2="480" y2="110" />
    <line x1="600" y1="10" x2="600" y2="110" />
  </g>

  <!-- Sync Mutex Icon Glyph -->
  <g transform="translate(36, 24)">
    <!-- Outer Glow Orbit -->
    <circle cx="36" cy="36" r="34" stroke="url(#tfGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.8" />
    
    <!-- Opposing Cyclical Arrows -->
    <path d="M 18 36 A 18 18 0 0 1 50 22" fill="none" stroke="url(#tfGrad)" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="50,15 56,23 46,26" fill="#38BDF8" />

    <path d="M 54 36 A 18 18 0 0 1 22 50" fill="none" stroke="url(#tfGrad)" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="22,57 16,49 26,46" fill="#818CF8" />

    <!-- Central Distributed Lock Core -->
    <rect x="27" y="27" width="18" height="18" rx="4" fill="#0F172A" stroke="url(#tfGrad)" stroke-width="2" />
    <circle cx="36" cy="34" r="2.5" fill="#38BDF8" />
    <line x1="36" y1="36.5" x2="36" y2="40.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="132" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="#F8FAFC">TANDEM<tspan fill="url(#tfGrad)">FLOW</tspan></text>
  <text x="134" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="2.5" fill="#94A3B8">ENTERPRISE 2-WAY SYNC &amp; MUTEX ENGINE</text>

  <!-- Status Pill -->
  <g transform="translate(560, 42)">
    <rect width="130" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#10B981" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="1">246 NODES</text>
  </g>
</svg>